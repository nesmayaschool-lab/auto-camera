<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>تصوير تلقائي</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap">
<style>
:root{--bg:#F6F4EF;--ink:#1B1B1B;--mute:#55524D;--teal:#0F766E;--red:#D32F2F}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Cairo,sans-serif;font-size:22px}
section{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:max(28px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
section[hidden]{display:none}
h1{margin:0;font-size:36px}
p{margin:0;font-size:21px;line-height:1.7;color:var(--mute)}
button,label.btn{min-height:70px;border-radius:16px;border:3px solid var(--teal);background:transparent;color:var(--teal);font:700 24px Cairo,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;width:100%;text-align:center;padding:6px 10px}
button.main{background:var(--teal);color:#fff}
button.stop{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.5}
.grow{flex:1}.col{display:flex;flex-direction:column;gap:14px}
.center{justify-content:center}
#msg{min-height:28px;color:var(--red);font-size:19px}
#faces{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
#faces img,.ph{width:110px;height:110px;border-radius:55px;object-fit:cover;border:3px solid var(--teal)}
.ph{display:flex;align-items:center;justify-content:center;border-style:dashed;color:var(--mute);font-size:18px;text-align:center}
#cam{background:#111;color:#fff}
#stage{position:relative;flex:1;min-height:0;border-radius:20px;overflow:hidden;background:#2A2A2A}
video#v{width:100%;height:100%;object-fit:cover}
[hidden]{display:none!important}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#bgv{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:10px;background:#2A2A2A;border-radius:24px;padding:10px 16px;font-size:20px;font-weight:700}
.dot{width:16px;height:16px;border-radius:8px;background:#888}
.on .dot{background:#FF5252}
#tm{font-size:26px}
#cam p{color:#D6D3CE;text-align:center;font-size:18px}
#cam button{border-color:#fff;color:#fff}
#cam button.stop{border-color:var(--red)}
.vid{background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.vid video{width:100%;border-radius:10px;background:#000}
.vid b{font-size:22px}
</style>
</head>
<body>

<section id="home" class="center">
<div class="grow col center"><h1>تصوير تلقائي</h1><p>يسجّل الفيديو فقط حين يظهر الشخص الذي تختاره، في أي مكان من الكادر.</p></div>
<div class="col"><button class="main" id="goStart">ابدأ تصوير جديد</button><button id="goVids">فيديوهاتي</button></div>
</section>

<section id="person" hidden>
<h1>اختر الشخص</h1>
<p>اختر صورة أو أكثر لوجه الشخص. كلما زادت الصور (من زوايا مختلفة) زادت الدقة.</p>
<div class="grow col center"><div id="faces"></div></div>
<div id="msg"></div>
<div class="col">
<label class="btn" for="file">اختيار صور من المعرض</label>
<input id="file" type="file" accept="image/*" multiple hidden>
<button class="main" id="next" disabled>حفظ والمتابعة</button>
<button id="back1">رجوع</button>
</div>
</section>

<section id="cam" hidden>
<div class="bar"><div class="pill" id="st"><span class="dot"></span><span id="stt">بانتظار الشخص</span></div><b id="tm">00:00</b></div>
<div id="stage"><video id="v" playsinline muted></video><canvas id="cv" hidden></canvas></div>
<div class="bar"><button id="flip">قلب الكاميرا</button><button id="zout" style="width:90px">−</button><button id="zin" style="width:90px">+</button></div>
<div class="bar"><button id="bg">تغيير الخلفية</button><button id="nobg" style="width:42%" hidden>بدون خلفية</button></div>
<p id="bgm"></p>
<button id="lv">الحساسية: متوسطة</button>
<button class="stop" id="end">إنهاء التصوير</button>
</section>

<section id="vids" hidden>
<h1>فيديوهاتي</h1>
<div id="list" class="col"></div>
<p id="empty"></p>
<div class="grow"></div>
<button id="back2">رجوع</button>
</section>

<video id="bgv" loop muted playsinline></video>
<input id="bgf" type="file" accept="image/*,video/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script>
const $=s=>document.querySelector(s);
const MP='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
// مستويات الحساسية: th = تطابق مباشر، loose = تطابق متساهل أثناء تتبع الشخص بعد أن تعرّفنا عليه
const LV=[{n:'دقيقة',th:.5,loose:.65},{n:'متوسطة',th:.6,loose:.8},{n:'واسعة',th:.68,loose:.92}];
const GRACE=1500; // مهلة قبل الإيقاف (مللي ثانية)
let lv=+(localStorage.getItem('lv')||1);
let refs=[],thumbs=[],ready=false,stream,astream,rec,chunks=[],running=false,lastSeen=0,facing='environment',recMs=0,timer,vids=[],wake,mime='';
let lastBox=null,lastT=0,lastLearn=0,zoom=1,drawOn=false,cvs=$('#cv'),cx=cvs.getContext('2d');
let bg=null,bgType='',seg=null,segBusy=false;const bgv=$('#bgv');
try{const s=JSON.parse(localStorage.getItem('person')||'null');if(s){refs=s.d.map(a=>new Float32Array(a));thumbs=s.t}}catch(e){}
const base=refs.length;

function show(id){document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==id)}
function msg(t){$('#msg').textContent=t||''}
function drawFaces(){const f=$('#faces');f.innerHTML='';if(!thumbs.length){f.innerHTML='<div class="ph">لا توجد صورة</div>'}thumbs.forEach(t=>{const i=new Image();i.src=t;f.appendChild(i)});$('#next').disabled=!refs.length}
async function loadModels(){if(ready)return;if(!window.faceapi)throw new Error('لم يتم تحميل مكتبة الوجوه. تأكد من الإنترنت.');
 await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MP),faceapi.nets.faceLandmark68TinyNet.loadFromUri(MP),faceapi.nets.faceRecognitionNet.loadFromUri(MP)]);ready=true}
const opts=(n,s)=>new faceapi.TinyFaceDetectorOptions({inputSize:n,scoreThreshold:s||0.5});

$('#goStart').onclick=()=>{show('person');drawFaces()};
$('#goVids').onclick=()=>{drawVids();show('vids')};
$('#back1').onclick=()=>show('home');
$('#back2').onclick=()=>show('home');
$('#lv').textContent='الحساسية: '+LV[lv].n;
$('#lv').onclick=()=>{lv=(lv+1)%3;localStorage.setItem('lv',lv);$('#lv').textContent='الحساسية: '+LV[lv].n};

$('#file').onchange=async e=>{
 const files=[...e.target.files];if(!files.length)return;
 msg('جاري تحليل الصور...');$('#next').disabled=true;
 try{await loadModels()}catch(er){msg(er.message);return}
 let bad=0;
 for(const f of files){
  const img=await faceapi.bufferToImage(f);
  const d=await faceapi.detectSingleFace(img,opts(608,.3)).withFaceLandmarks(true).withFaceDescriptor();
  if(!d){bad++;continue}
  refs.push(d.descriptor);
  const b=d.detection.box,c=document.createElement('canvas');c.width=c.height=96;
  const sz=Math.max(b.width,b.height)*1.2;
  c.getContext('2d').drawImage(img,b.x+b.width/2-sz/2,b.y+b.height/2-sz/2,sz,sz,0,0,96,96);
  thumbs.push(c.toDataURL('image/jpeg',.8));
 }
 e.target.value='';
 try{localStorage.setItem('person',JSON.stringify({d:refs.slice(0,thumbs.length).map(a=>Array.from(a)),t:thumbs}))}catch(er){}
 drawFaces();
 msg(bad?`لم أجد وجهاً واضحاً في ${bad} صورة. جرّب صورة أوضح.`:'');
};

$('#next').onclick=async()=>{
 msg('جاري تجهيز الكاميرا...');
 try{await loadModels();astream=await navigator.mediaDevices.getUserMedia({audio:true}).catch(()=>null);await startCam();show('cam');beginRec()}
 catch(er){msg('تعذّر التشغيل: '+(er.message||er)+' (اسمح للتطبيق باستخدام الكاميرا والمايك)')}
};

function note(t){$('#bgm').textContent=t||''}
async function startCam(){
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 const v=$('#v');v.srcObject=null;
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
 v.srcObject=stream;v.style.transform=facing==='user'?'scaleX(-1)':'none';await v.play();
 zoom=1;lastBox=null;
}
$('#flip').onclick=async()=>{
 if(!running)return;const prev=facing;facing=facing==='user'?'environment':'user';note('جاري قلب الكاميرا...');
 try{await startCam();note(facing==='user'?'الكاميرا الأمامية':'الكاميرا الخلفية');setTimeout(()=>note(''),2500)}
 catch(e){facing=prev;try{await startCam()}catch(e2){}note('تعذّر فتح الكاميرا الأخرى ('+(e.name||'خطأ')+')')}
};
async function setZoom(d){
 const t=stream&&stream.getVideoTracks()[0];const c=t&&t.getCapabilities&&t.getCapabilities();
 if(!c||!c.zoom){alert('هذه الكاميرا لا تدعم التقريب. اقترب من الشخص أكثر.');return}
 zoom=Math.min(c.zoom.max,Math.max(c.zoom.min,zoom+d*Math.max(.5,(c.zoom.max-c.zoom.min)/8)));
 try{await t.applyConstraints({advanced:[{zoom}]})}catch(e){}
}
$('#zin').onclick=()=>setZoom(1);$('#zout').onclick=()=>setZoom(-1);

// نرسم الكاميرا على لوحة ونسجّل اللوحة، فيبقى الفيديو واحداً حتى لو بدّلت الكاميرا
function cover(src,sw,sh){const k=Math.max(cvs.width/sw,cvs.height/sh),w=sw*k,h=sh*k;cx.drawImage(src,(cvs.width-w)/2,(cvs.height-h)/2,w,h)}
function paint(){
 if(!drawOn)return;
 const v=$('#v');
 if(v.videoWidth){
  if(!cvs.width){const k=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight));cvs.width=Math.round(v.videoWidth*k);cvs.height=Math.round(v.videoHeight*k)}
  if(bg&&seg){if(!segBusy){segBusy=true;seg.send({image:v}).catch(()=>{}).finally(()=>segBusy=false)}}
  else cover(v,v.videoWidth,v.videoHeight);
 }
 requestAnimationFrame(paint);
}
// تبديل الخلفية: نفصل الشخص عن خلفيته ثم نضعه فوق الصورة أو الفيديو المختار
function onSeg(r){
 if(!drawOn||!bg)return;const v=$('#v'),m=r.segmentationMask;
 cx.save();cx.clearRect(0,0,cvs.width,cvs.height);
 cx.filter='blur(3px)';cover(m,m.width,m.height);cx.filter='none';
 cx.globalCompositeOperation='source-in';cover(v,v.videoWidth,v.videoHeight);
 cx.globalCompositeOperation='destination-over';
 if(bgType==='video')cover(bgv,bgv.videoWidth,bgv.videoHeight);else cover(bg,bg.width,bg.height);
 cx.restore();
}
function loadSeg(){
 if(seg)return Promise.resolve();
 const B='https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/';
 return new Promise((res,rej)=>{const t=document.createElement('script');t.src=B+'selfie_segmentation.js';
  t.onload=async()=>{try{const g=new SelfieSegmentation({locateFile:f=>B+f});g.setOptions({modelSelection:0});g.onResults(onSeg);await g.initialize();seg=g;res()}catch(e){rej(e)}};
  t.onerror=rej;document.head.appendChild(t)});
}
$('#bg').onclick=()=>$('#bgf').click();
$('#bgf').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 $('#bgm').textContent='جاري تجهيز الخلفية... (أول مرة تأخذ وقتاً)';
 try{
  await loadSeg();const url=URL.createObjectURL(f);
  if(f.type.startsWith('video')){bgv.src=url;await bgv.play();bg=bgv;bgType='video'}
  else{const im=new Image();im.src=url;await im.decode();bg=im;bgType='img'}
  cvs.hidden=false;$('#nobg').hidden=false;$('#bgm').textContent='';
 }catch(er){$('#bgm').textContent='تعذّر تجهيز الخلفية. تأكد من الإنترنت وجرّب مرة أخرى.'}
};
function clearBg(){bg=null;bgv.pause();cvs.hidden=true;$('#nobg').hidden=true;$('#bgm').textContent=''}
$('#nobg').onclick=clearBg;

function beginRec(){
 mime=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
 chunks=[];recMs=0;lastSeen=0;running=true;lastBox=null;cvs.width=0;drawOn=true;paint();
 const out=new MediaStream([...cvs.captureStream(30).getVideoTracks(),...(astream?astream.getAudioTracks():[])]);
 setTimeout(()=>{ // ننتظر لحظة حتى ترسم اللوحة أول صورة
  rec=new MediaRecorder(out,mime?{mimeType:mime,videoBitsPerSecond:4e6}:{});
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.start(1000);rec.pause();setStatus(false);look();
 },400);
 clearInterval(timer);timer=setInterval(()=>{if(rec&&rec.state==='recording')recMs+=500;const s=Math.floor(recMs/1000);$('#tm').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);
 if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{});
}
function setStatus(on){$('#st').className='pill'+(on?' on':'');$('#stt').textContent=on?'التسجيل شغال':'متوقف: بانتظار الشخص'}

async function look(){
 if(!running)return;
 try{
  const L=LV[lv];
  const ds=await faceapi.detectAllFaces($('#v'),opts(512,.3)).withFaceLandmarks(true).withFaceDescriptors();
  const now=Date.now();let hit=null;
  const sc=ds.map(d=>({d,dist:Math.min(...refs.map(r=>faceapi.euclideanDistance(d.descriptor,r)))}));
  const strong=sc.filter(x=>x.dist<L.th).sort((a,b)=>a.dist-b.dist)[0];
  if(strong){hit=strong;
   if(strong.dist<L.th*.9&&now-lastLearn>2500&&refs.length<base+12){refs.push(strong.d.descriptor);lastLearn=now} // يتعلم زوايا جديدة
  }else if(lastBox&&now-lastT<5000){ // تتبّع: وجه قريب من مكان آخر ظهور وشبهه كافٍ
   const lx=lastBox.x+lastBox.width/2,ly=lastBox.y+lastBox.height/2,ls=Math.max(lastBox.width,lastBox.height);
   hit=sc.filter(x=>{const b=x.d.detection.box;return x.dist<L.loose&&Math.hypot(b.x+b.width/2-lx,b.y+b.height/2-ly)<ls*2.5}).sort((a,b)=>a.dist-b.dist)[0]||null;
  }
  if(hit){lastBox=hit.d.detection.box;lastT=now;lastSeen=now;if(rec.state==='paused'){rec.resume();setStatus(true)}}
  else if(rec.state==='recording'&&now-lastSeen>GRACE){rec.pause();setStatus(false)}
  if(rec.state==='paused')$('#stt').textContent='متوقف: '+(ds.length?'أرى '+ds.length+' وجه وليس الشخص المطلوب':'لا أرى أي وجه');
 }catch(e){}
 setTimeout(look,100);
}

function finish(){
 return new Promise(res=>{
  running=false;drawOn=false;clearBg();clearInterval(timer);if(wake)wake.release().catch(()=>{});
  const done=()=>{
   if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
   if(astream){astream.getTracks().forEach(t=>t.stop());astream=null}
   if(chunks.length&&recMs>0){
    const type=(rec.mimeType||mime||'video/webm').split(';')[0];
    vids.unshift({url:URL.createObjectURL(new Blob(chunks,{type})),ext:type.includes('mp4')?'mp4':'webm',ms:recMs,at:new Date()});
   }
   res();
  };
  if(rec&&rec.state!=='inactive'){rec.onstop=done;rec.stop()}else done();
 });
}
$('#end').onclick=async()=>{const n=vids.length;await finish();drawVids();show('vids');if(vids.length===n)$('#empty').textContent='لم يظهر الشخص أثناء التصوير، لذلك لم يُحفظ فيديو.'};

function fmt(ms){const s=Math.round(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function drawVids(){
 const l=$('#list');l.innerHTML='';$('#empty').textContent=vids.length?'':'لا توجد فيديوهات بعد. ابدأ تصويراً جديداً.';
 vids.forEach((v,i)=>{
  const d=document.createElement('div');d.className='vid';
  d.innerHTML=`<b>فيديو ${vids.length-i} — ${fmt(v.ms)}</b><video controls playsinline src="${v.url}"></video><a><button class="main">حفظ في الجوال</button></a>`;
  const a=d.querySelector('a');a.href=v.url;a.download=`video-${v.at.toISOString().slice(0,19).replace(/[:T]/g,'-')}.${v.ext}`;
  l.appendChild(d);
 });
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
